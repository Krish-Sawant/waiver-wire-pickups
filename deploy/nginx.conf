# nginx /api proxy for the FastAPI backend.
#
# Amazon Linux 2023's nginx ships its own default server block (listening on 80,
# serving /usr/share/nginx/html) baked into /etc/nginx/nginx.conf. Rather than
# fight it with a second server block (which collides on `default_server` and
# leaves /api returning nginx's stock 404), drop just this /api location into
# /etc/nginx/default.d/, which the stock server `include`s. Everything else
# keeps serving normally; /api/* proxies to uvicorn on 127.0.0.1:8000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/default.d/waiverwire.conf
#   sudo rm -f /etc/nginx/conf.d/waiverwire.conf   # remove any old full-server copy
#   sudo nginx -t && sudo systemctl reload nginx

location /api/ {
    proxy_pass         http://127.0.0.1:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Gemini-backed endpoints (outlook/chat/compare) can be slow to respond.
    proxy_read_timeout 120s;
}
