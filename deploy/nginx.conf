# nginx reverse proxy: public port 80 -> uvicorn on 127.0.0.1:8000.
# CloudFront terminates HTTPS and forwards here over HTTP, so no TLS config is
# needed on the box itself.
#
# Install on Amazon Linux 2023 with:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/waiverwire.conf
#   sudo nginx -t && sudo systemctl enable --now nginx
#   sudo systemctl reload nginx     # after edits

server {
    listen 80 default_server;
    server_name _;

    # API -> FastAPI. Everything the frontend calls is under /api.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Bearer tokens ride in the Authorization header; nginx forwards it by
        # default, but keep the reference for the Gemini endpoints which can be
        # slow to respond.
        proxy_read_timeout 120s;
    }

    # Simple health check target (returns 401 from the auth gate = alive).
    location = / {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
